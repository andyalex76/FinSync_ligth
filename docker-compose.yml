# =====================================================================
# FinSync (Семейный Бюджет) - Self-Hosted Production Stack
# Constraints: 100% local processing, VPS friendly
# Input: only the Telegram bot and Mini App. The web dashboard is a read-only view.
# Network Segmentation:
# - db_net (internal): strictly isolated for PostgreSQL and Backend API
# - app_net: Backend API, Telegram Bot, and Dashboard Web
# =====================================================================

services:
  # 1. Primary Relational Database (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: family_budget_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-family_budget}
      POSTGRES_USER: ${POSTGRES_USER:-budget_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budget_admin} -d ${POSTGRES_DB:-family_budget}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - db_net

  # 2. FastAPI Core Backend (Gateway across DB and App networks)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: family_budget_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-budget_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-family_budget}
      BASE_CURRENCY: ${BASE_CURRENCY:-RUB}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set in .env}
      TELEGRAM_ADMIN_CHAT_IDS: ${TELEGRAM_ADMIN_CHAT_IDS:-}
      ALLOWED_TELEGRAM_IDS: ${ALLOWED_TELEGRAM_IDS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - db_net
      - app_net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # 3. Telegram Bot (aiogram 3 - Isolated from database)
  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: family_budget_bot
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set in .env}
      BACKEND_API_URL: http://backend:8000
      APP_URL: ${APP_URL:-https://budget.your-domain.ru}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY is required}
      TELEGRAM_ADMIN_CHAT_IDS: ${TELEGRAM_ADMIN_CHAT_IDS:-}
      ALLOWED_TELEGRAM_IDS: ${ALLOWED_TELEGRAM_IDS:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  # 4. Web Dashboard (read-only view, isolated from database)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: family_budget_dashboard
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - app_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

volumes:
  pg_data:

networks:
  # 1. Database network: strictly isolated, only postgres and backend
  db_net:
    driver: bridge
    internal: true
  # 2. Application network: backend, telegram_bot, and dashboard web interface
  app_net:
    driver: bridge
